<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마스터 관리자 - 통합 시설 관리 플랫폼</title>
    
    <!-- CDNs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .facility-card {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .facility-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            animation: fadeIn 0.3s;
        }
        .modal-content {
            background: white;
            margin: 5% auto;
            padding: 0;
            width: 90%;
            max-width: 600px;
            border-radius: 1rem;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            animation: slideIn 0.3s;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .badge-active {
            background: #10b981;
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-inactive {
            background: #ef4444;
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    
    <!-- 로그인 화면 -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-10 rounded-2xl shadow-2xl w-96">
            <div class="text-center mb-8">
                <div class="w-24 h-24 bg-gradient-to-br from-blue-500 to-purple-600 rounded-full mx-auto mb-6 flex items-center justify-center">
                    <i class="fas fa-crown text-white text-4xl"></i>
                </div>
                <h1 class="text-3xl font-bold text-gray-800 mb-2">마스터 관리자</h1>
                <p class="text-gray-600">통합 시설 관리 플랫폼</p>
            </div>
            <input type="password" id="masterPin" placeholder="마스터 PIN 입력" 
                   class="w-full px-4 py-3 border border-gray-300 rounded-lg mb-4 focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                   onkeypress="if(event.key==='Enter') masterApp.login()">
            <button onclick="masterApp.login()" 
                    class="w-full bg-gradient-to-r from-blue-500 to-purple-600 text-white py-3 rounded-lg font-semibold hover:shadow-lg transition-all">
                <i class="fas fa-sign-in-alt mr-2"></i>로그인
            </button>
            <p class="text-xs text-gray-500 text-center mt-4">
                마스터 관리자 전용 시스템입니다
            </p>
        </div>
    </div>

    <!-- 메인 대시보드 -->
    <div id="mainDashboard" style="display:none;" class="min-h-screen p-8">
        
        <!-- 헤더 -->
        <div class="bg-white rounded-2xl shadow-lg p-6 mb-8">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <div class="w-16 h-16 bg-gradient-to-br from-blue-500 to-purple-600 rounded-xl flex items-center justify-center">
                        <i class="fas fa-crown text-white text-2xl"></i>
                    </div>
                    <div>
                        <h1 class="text-3xl font-bold text-gray-800">마스터 관리자</h1>
                        <p class="text-gray-600">통합 시설 관리 플랫폼</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <div id="clock" class="text-lg font-semibold text-gray-700"></div>
                    <button onclick="masterApp.logout()" 
                            class="px-6 py-3 bg-red-50 text-red-600 rounded-lg hover:bg-red-100 transition-all font-semibold">
                        <i class="fas fa-sign-out-alt mr-2"></i>로그아웃
                    </button>
                </div>
            </div>
        </div>

        <!-- 통계 카드 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="stat-card">
                <div class="flex items-center justify-between mb-2">
                    <i class="fas fa-building text-3xl"></i>
                    <span class="text-2xl font-bold" id="totalFacilities">0</span>
                </div>
                <p class="text-sm opacity-90">전체 시설</p>
            </div>
            <div class="stat-card">
                <div class="flex items-center justify-between mb-2">
                    <i class="fas fa-users text-3xl"></i>
                    <span class="text-2xl font-bold" id="totalEmployees">0</span>
                </div>
                <p class="text-sm opacity-90">전체 직원</p>
            </div>
            <div class="stat-card">
                <div class="flex items-center justify-between mb-2">
                    <i class="fas fa-user-friends text-3xl"></i>
                    <span class="text-2xl font-bold" id="totalMembers">0</span>
                </div>
                <p class="text-sm opacity-90">전체 회원</p>
            </div>
            <div class="stat-card">
                <div class="flex items-center justify-between mb-2">
                    <i class="fas fa-bell text-3xl"></i>
                    <span class="text-2xl font-bold" id="pendingRequests">0</span>
                </div>
                <p class="text-sm opacity-90">미승인 요청</p>
            </div>
        </div>

        <!-- 시설 추가 버튼 -->
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-2xl font-bold text-white">등록된 시설</h2>
            <button onclick="masterApp.openAddFacilityModal()" 
                    class="px-6 py-3 bg-white text-purple-600 rounded-lg hover:shadow-xl transition-all font-semibold">
                <i class="fas fa-plus mr-2"></i>시설 추가
            </button>
        </div>

        <!-- 시설 카드 그리드 -->
        <div id="facilitiesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- 동적으로 로딩 -->
        </div>

    </div>

    <!-- 시설 추가 모달 -->
    <div id="addFacilityModal" class="modal">
        <div class="modal-content">
            <div class="bg-gradient-to-r from-blue-500 to-purple-600 p-6 rounded-t-xl">
                <div class="flex items-center justify-between">
                    <h3 class="text-2xl font-bold text-white">
                        <i class="fas fa-plus-circle mr-2"></i>새 시설 추가
                    </h3>
                    <button onclick="masterApp.closeModal()" class="text-white hover:text-gray-200">
                        <i class="fas fa-times text-2xl"></i>
                    </button>
                </div>
            </div>
            <div class="p-6">
                <form id="addFacilityForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">시설명 *</label>
                        <input type="text" id="facility_name" required 
                               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500" 
                               placeholder="예: 힐스테이트 강남">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">시설 타입 *</label>
                        <select id="facility_type" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500">
                            <option value="">선택</option>
                            <option value="apartment">아파트 (ERP)</option>
                            <option value="fitness">헬스장/필라테스 (CRM)</option>
                            <option value="office">오피스텔</option>
                            <option value="commercial">상가</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">주소</label>
                        <input type="text" id="facility_address" 
                               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500" 
                               placeholder="시설 주소">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">연락처</label>
                            <input type="tel" id="facility_phone" 
                                   class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500" 
                                   placeholder="010-1234-5678">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">담당자명</label>
                            <input type="text" id="facility_manager" 
                                   class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500" 
                                   placeholder="홍길동">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">구독 플랜</label>
                        <select id="facility_plan" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500">
                            <option value="basic">Basic - 기본 기능</option>
                            <option value="pro" selected>Pro - 고급 기능</option>
                            <option value="enterprise">Enterprise - 전체 기능</option>
                        </select>
                    </div>
                    <div class="bg-blue-50 p-4 rounded-lg">
                        <p class="text-sm text-blue-800">
                            <i class="fas fa-info-circle mr-2"></i>
                            시설 추가 시 해당 시설 전용 관리 시스템이 자동으로 생성됩니다.
                        </p>
                    </div>
                    <div class="flex space-x-3 pt-4">
                        <button type="submit" 
                                class="flex-1 bg-gradient-to-r from-blue-500 to-purple-600 text-white py-3 rounded-lg hover:shadow-lg transition-all font-semibold">
                            <i class="fas fa-plus mr-2"></i>시설 추가
                        </button>
                        <button type="button" onclick="masterApp.closeModal()" 
                                class="flex-1 bg-gray-500 text-white py-3 rounded-lg hover:bg-gray-600 transition-all font-semibold">
                            <i class="fas fa-times mr-2"></i>취소
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="shared-config.js"></script>
    <script src="master-admin.js"></script>

</body>
</html>
