<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주말 근무시간 테스트</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            border-bottom: 3px solid #f59e0b;
            padding-bottom: 10px;
        }
        .test-section {
            margin: 30px 0;
            padding: 20px;
            background: #f9fafb;
            border-left: 4px solid #3b82f6;
            border-radius: 4px;
        }
        .weekend-section {
            border-left-color: #f59e0b;
            background: #fffbeb;
        }
        .result {
            margin: 15px 0;
            padding: 15px;
            background: white;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }
        .result.weekend {
            background: #fef3c7;
            border-color: #f59e0b;
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge.weekday { background: #dbeafe; color: #1e40af; }
        .badge.weekend { background: #fed7aa; color: #9a3412; }
        .badge.late { background: #fecaca; color: #991b1b; }
        .badge.normal { background: #d1fae5; color: #065f46; }
        code {
            background: #f3f4f6;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            color: #1f2937;
        }
        .info {
            background: #dbeafe;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #3b82f6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📅 주말 근무시간 기능 테스트</h1>
        
        <div class="info">
            <strong>🎯 테스트 목적:</strong> 주말과 평일에 따라 자동으로 다른 근무시간이 적용되는지 확인
        </div>

        <div class="test-section">
            <h2>👤 테스트 직원 데이터</h2>
            <div id="employeeData"></div>
        </div>

        <div class="test-section weekend-section">
            <h2>🔍 요일별 근무시간 테스트</h2>
            <div id="weekdayTests"></div>
        </div>

        <div class="test-section">
            <h2>⏰ 근태 체크 시뮬레이션</h2>
            <div id="attendanceTests"></div>
        </div>
    </div>

    <script>
        // Mock unifiedApp for testing
        const unifiedApp = {
            getEmployeeWorkTime: function(employee, date = new Date()) {
                const dayOfWeek = date.getDay();
                const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
                
                if (isWeekend && employee.weekend_start_time && employee.weekend_end_time) {
                    return {
                        start_time: employee.weekend_start_time,
                        end_time: employee.weekend_end_time,
                        is_weekend: true
                    };
                }
                
                return {
                    start_time: employee.work_start_time || '09:00',
                    end_time: employee.work_end_time || '18:00',
                    is_weekend: false
                };
            },

            checkAttendanceTime: function(employee, checkTime = new Date()) {
                const workTime = this.getEmployeeWorkTime(employee, checkTime);
                const currentTimeStr = checkTime.toTimeString().substring(0, 5);
                
                const isLate = currentTimeStr > workTime.start_time;
                
                return {
                    work_start: workTime.start_time,
                    work_end: workTime.end_time,
                    current_time: currentTimeStr,
                    is_weekend: workTime.is_weekend,
                    is_late: isLate,
                    status: isLate ? '지각' : '정상'
                };
            }
        };

        // Test employee data
        const testEmployee = {
            id: 'test-001',
            name: '김철수',
            position: '관리부장',
            work_start_time: '09:00',  // 평일 근무시간
            work_end_time: '18:00',
            weekend_start_time: '10:00',  // 주말 근무시간
            weekend_end_time: '16:00'
        };

        const employeeWithoutWeekendHours = {
            id: 'test-002',
            name: '이영희',
            position: '사무직',
            work_start_time: '08:30',
            work_end_time: '17:30',
            weekend_start_time: null,  // 주말 근무시간 미설정
            weekend_end_time: null
        };

        // Display employee data
        function displayEmployeeData() {
            const html = `
                <div class="result">
                    <h3>직원 1: ${testEmployee.name} <span class="badge weekend">주말시간 설정 ✅</span></h3>
                    <p>평일 근무시간: <code>${testEmployee.work_start_time} ~ ${testEmployee.work_end_time}</code></p>
                    <p>주말 근무시간: <code>${testEmployee.weekend_start_time} ~ ${testEmployee.weekend_end_time}</code></p>
                </div>
                <div class="result">
                    <h3>직원 2: ${employeeWithoutWeekendHours.name} <span class="badge weekday">주말시간 미설정 ❌</span></h3>
                    <p>평일 근무시간: <code>${employeeWithoutWeekendHours.work_start_time} ~ ${employeeWithoutWeekendHours.work_end_time}</code></p>
                    <p>주말 근무시간: <code>NULL (평일 시간 사용)</code></p>
                </div>
            `;
            document.getElementById('employeeData').innerHTML = html;
        }

        // Test weekdays
        function testWeekdays() {
            const days = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
            let html = '';

            for (let day = 0; day < 7; day++) {
                const testDate = new Date(2026, 4, 25 + day); // 2026-05-25 is Monday
                const dayName = days[testDate.getDay()];
                const isWeekend = (testDate.getDay() === 0 || testDate.getDay() === 6);
                
                const workTime1 = unifiedApp.getEmployeeWorkTime(testEmployee, testDate);
                const workTime2 = unifiedApp.getEmployeeWorkTime(employeeWithoutWeekendHours, testDate);

                html += `
                    <div class="result ${isWeekend ? 'weekend' : ''}">
                        <h4>${dayName} (${testDate.toLocaleDateString('ko-KR')}) 
                            <span class="badge ${isWeekend ? 'weekend' : 'weekday'}">${isWeekend ? '주말' : '평일'}</span>
                        </h4>
                        <p><strong>${testEmployee.name}:</strong> 
                            <code>${workTime1.start_time} ~ ${workTime1.end_time}</code>
                            ${workTime1.is_weekend ? '<span class="badge weekend">주말시간 적용</span>' : '<span class="badge weekday">평일시간 적용</span>'}
                        </p>
                        <p><strong>${employeeWithoutWeekendHours.name}:</strong> 
                            <code>${workTime2.start_time} ~ ${workTime2.end_time}</code>
                            <span class="badge weekday">평일시간 적용</span>
                        </p>
                    </div>
                `;
            }

            document.getElementById('weekdayTests').innerHTML = html;
        }

        // Test attendance checking
        function testAttendance() {
            const scenarios = [
                { day: 1, time: '08:55', desc: '평일 정상 출근' },
                { day: 1, time: '09:30', desc: '평일 지각' },
                { day: 6, time: '09:55', desc: '토요일 정상 출근 (주말시간 있음)' },
                { day: 6, time: '10:30', desc: '토요일 지각 (주말시간 있음)' },
                { day: 0, time: '10:00', desc: '일요일 정상 출근 (주말시간 있음)' },
            ];

            let html = '';

            scenarios.forEach(scenario => {
                const testDate = new Date(2026, 4, 25);
                testDate.setDate(testDate.getDate() + scenario.day);
                testDate.setHours(parseInt(scenario.time.split(':')[0]));
                testDate.setMinutes(parseInt(scenario.time.split(':')[1]));

                const attendance = unifiedApp.checkAttendanceTime(testEmployee, testDate);
                const days = ['일', '월', '화', '수', '목', '금', '토'];

                html += `
                    <div class="result ${attendance.is_weekend ? 'weekend' : ''}">
                        <h4>${scenario.desc}</h4>
                        <p>날짜: ${testDate.toLocaleDateString('ko-KR')} (${days[testDate.getDay()]}요일)</p>
                        <p>출근 시간: <code>${attendance.current_time}</code></p>
                        <p>근무 시작: <code>${attendance.work_start}</code></p>
                        <p>상태: <span class="badge ${attendance.is_late ? 'late' : 'normal'}">${attendance.status}</span>
                            ${attendance.is_weekend ? '<span class="badge weekend">주말</span>' : '<span class="badge weekday">평일</span>'}
                        </p>
                    </div>
                `;
            });

            document.getElementById('attendanceTests').innerHTML = html;
        }

        // Run tests
        displayEmployeeData();
        testWeekdays();
        testAttendance();
    </script>
</body>
</html>
